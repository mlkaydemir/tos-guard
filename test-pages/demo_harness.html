<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ToS-Guard | E2E Demo & Extension Test Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #020617;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header.harness-nav {
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
    }
    .harness-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .harness-controls {
      display: flex;
      gap: 10px;
    }
    .harness-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .harness-btn:hover { background: #334155; color: #fff; }
    .harness-btn.active { background: #4f46e5; color: #fff; border-color: #6366f1; }
    
    .harness-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 52px);
    }
    .browser-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      background: #090d16;
    }
    .address-bar {
      height: 40px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
    .url-pill {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 4px 14px;
      color: #cbd5e1;
      flex: 1;
      font-family: monospace;
      font-size: 12px;
    }
    iframe#page-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    .extension-view {
      width: 460px;
      background: #090d16;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    iframe#popup-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header class="harness-nav">
    <div class="harness-brand">
      <span>🛡️</span>
      <span>ToS-Guard E2E Doğrulama Platformu</span>
    </div>
    <div class="harness-controls">
      <button class="harness-btn active" id="btn-demo-instagram" data-url="/instagram">1. Mutlu Yol (Instagram ToS)</button>
      <button class="harness-btn" id="btn-demo-ambiguity" data-url="/ambiguity">2. Dürüst Belirsizlik Yolu (CloudCorp)</button>
      <button class="harness-btn" id="btn-demo-injection" data-url="/injection">3. Güvenlik Yolu (Prompt Injection)</button>
    </div>
  </header>

  <div class="harness-layout">
    <div class="browser-view">
      <div class="address-bar">
        <span>🔒 Güvenli Bağlantı</span>
        <div class="url-pill" id="url-display">https://www.instagram.com/legal/terms/</div>
      </div>
      <iframe id="page-frame" src="/instagram"></iframe>
    </div>

    <div class="extension-view">
      <iframe id="popup-frame" src="/popup"></iframe>
    </div>
  </div>

  <script>
    const pageFrame = document.getElementById('page-frame');
    const popupFrame = document.getElementById('popup-frame');
    const urlDisplay = document.getElementById('url-display');
    const buttons = document.querySelectorAll('.harness-btn');

    const urls = {
      '/instagram': 'https://www.instagram.com/legal/terms/',
      '/ambiguity': 'https://cloudcorp.io/ambiguous-privacy-terms/',
      '/injection': 'https://sketchy-site.xyz/adversarial-terms/'
    };

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const target = btn.getAttribute('data-url');
        pageFrame.src = target;
        urlDisplay.textContent = urls[target] || target;
        popupFrame.src = '/popup';
      });
    });

    // Bridge message passing between popupFrame and pageFrame
    window.addEventListener('message', (event) => {
      if (event.data && event.data.action === 'HIGHLIGHT_SEGMENT') {
        // Forward highlight request to pageFrame
        pageFrame.contentWindow.postMessage(event.data, '*');
      }
    });
  </script>
</body>
</html>
